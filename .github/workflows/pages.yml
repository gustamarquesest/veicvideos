name: Validate and publish Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: node --check script.js
      - name: Test asset retention
        run: node tools/test-assets.cjs
      - name: Generate and validate site artifact
        run: node tools/prepare-pages.cjs "$RUNNER_TEMP/veic-pages"
      - name: Check artifact references before upload
        run: node tools/version-assets.cjs --check --root "$RUNNER_TEMP/veic-pages"
      - name: Check preserved asset history
        run: node tools/preserve-assets.cjs --check "$RUNNER_TEMP/veic-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/veic-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
